services:
  mysql:
    image: mysql:26.7@sha256:45abdd9b4144660b5c93a5b7d0ebb21e024f0ba9851ecb4ab43bf83c6bf83592
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--silent" ]
      interval: 5s
      timeout: 5s
      retries: 12

  phpunit:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - wp-tests-cache:/tmp/wordpress-tests-lib
    environment:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
    command: >
      bash -c "
        composer install --no-interaction &&
        bash bin/install-wp-tests.sh wordpress_test root root mysql latest &&
        vendor/bin/phpunit
      "

volumes:
  wp-tests-cache:
