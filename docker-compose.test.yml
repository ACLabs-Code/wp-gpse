services:
  mysql:
    image: mysql:9.7@sha256:8fdf311514c91fa5014e93e98e19d7f5d9eb162a462c13100c956dacc278ee21
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--silent" ]
      interval: 5s
      timeout: 5s
      retries: 12

  phpunit:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - wp-tests-cache:/tmp/wordpress-tests-lib
    environment:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
    command: >
      bash -c "
        composer install --no-interaction &&
        bash bin/install-wp-tests.sh wordpress_test root root mysql latest &&
        vendor/bin/phpunit
      "

volumes:
  wp-tests-cache:
