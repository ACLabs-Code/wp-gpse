services:
  mysql:
    image: mysql:26.10@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--silent" ]
      interval: 5s
      timeout: 5s
      retries: 12

  phpunit:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - wp-tests-cache:/tmp/wordpress-tests-lib
    environment:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
    command: >
      bash -c "
        composer install --no-interaction &&
        bash bin/install-wp-tests.sh wordpress_test root root mysql latest &&
        vendor/bin/phpunit
      "

volumes:
  wp-tests-cache:
